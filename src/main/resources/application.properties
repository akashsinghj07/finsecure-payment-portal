spring.application.name=payment-portal
server.port = ${PORT:8080}

# In-memory H2 database configuration
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Web console to view database tables in browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auto-generate DB schema from Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
