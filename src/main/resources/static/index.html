<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSecure - Digital Banking Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- MODULAR COMPONENT: NAVBAR -->
    <div id="navbar-container"></div>

    <div class="container my-4">
        <!-- Account Summary -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card card-custom p-4">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <h6 class="text-muted text-uppercase mb-1">Savings Account Number</h6>
                            <h3 class="fw-bold mb-0">501004289123</h3>
                            <span class="badge bg-success mt-2">ACTIVE</span>
                        </div>
                        <div class="col-md-6 text-md-end mt-3 mt-md-0">
                            <h6 class="text-muted text-uppercase mb-1">Available Ledger Balance</h6>
                            <div class="balance-badge" id="displayBalance">₹...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Transfer Form -->
            <div class="col-lg-5 mb-4">
                <div class="card card-custom p-4 h-100">
                    <h5 class="fw-bold text-dark mb-3">💸 Instant Fund Transfer</h5>
                    <form id="transferForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">DEBIT ACCOUNT</label>
                            <input type="text" class="form-control" id="sourceAccount" value="501004289123" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">BENEFICIARY ACCOUNT</label>
                            <input type="text" class="form-control" id="destinationAccount" placeholder="e.g. 63434343(Guri)" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">AMOUNT (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="amount" placeholder="Min ₹1.00" required>
                        </div>
                        <button type="button" class="btn btn-bank w-100" id="transferBtn">
                            Pay Securely & Transfer
                        </button>
                        <div id="alertBox" class="alert d-none" role="alert"></div>
                    </form>
                </div>
            </div>

            <!-- Passbook History -->
            <div class="col-lg-7 mb-4">
                <div class="card card-custom p-4 h-100">
                    <h5 class="fw-bold text-dark mb-3">📜 Account Passbook & History</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Txn ID</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="txnTableBody">
                                <tr>
                                    <td><strong>#INIT</strong></td>
                                    <td>Initial Account Seeded</td>
                                    <td class="text-success fw-bold">+₹70,000.00</td>
                                    <td><span class="badge bg-secondary">SYSTEM</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODULAR COMPONENT: FOOTER -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
